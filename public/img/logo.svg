<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" shape-rendering="geometricPrecision">
  <!-- Define the canvas background color for reference -->
  <rect width="100" height="100" fill="#FAF8F5"/>

  <!-- Main Compass Structure (Amber Gold) -->
  <path d="M50 5 L55 35 L85 40 L55 45 L50 75 L45 45 L15 40 L45 35 Z" fill="#D97706"/>
  
  <!-- Outer Ring (Amber Gold) -->
  <circle cx="50" cy="40" r="32" stroke="#D97706" stroke-width="2" fill="none"/>

  <!-- Compass Needle / Nibs (Deep Midnight Blue) -->
  <path d="M50 12 L53 35 L50 68 L47 35 Z" fill="#141A29"/>
  <path d="M22 40 L45 37 L78 40 L45 43 Z" fill="#141A29"/>

  <!-- Inner Shield/Circle (Deep Midnight Blue) -->
  <circle cx="50" cy="40" r="18" fill="#141A29"/>

  <!-- Monogram (N and S Interlocking - Amber Gold) -->
  <g transform="translate(50, 40)" fill="#D97706">
    <!-- Stylized 'N' -->
    <path d="M-10 -10 L-10 10 L-6 10 L-6 -6 L6 10 L6 -10 L2 -10 L2 6 L-10 -10 Z" />
    <!-- Stylized 'S' Interlocking -->
    <path d="M-6 4 C-6 1, -2 -2, 2 -2 C6 -2, 8 1, 8 4 C8 7, 6 10, 2 10 L-6 10 L-6 14 C-6 17, -2 20, 2 20 C6 20, 8 17, 8 14" stroke="#D97706" stroke-width="1.5" fill="none" transform="translate(0, 0) scale(0.9)"/>
    <!-- Note: A cleaner monogram is defined below for better rendering -->
  </g>
  
  <!-- Refined Monogram Group (Using simpler paths for clarity) -->
  <g transform="translate(38, 28)" fill="#D97706">
      <path d="M0 0 L0 24 L6 24 L6 8 L18 24 L18 0 L12 0 L12 16 L0 0 Z"/>
      <path d="M12 2 C12 1.5 13 1 15 1 C17 1 18 1.5 18 2 C18 3 17 3.5 15 3.5 C13 3.5 12 3 12 2" transform="translate(0, 22) scale(1, 1.2)"/>
  </g>
  
</svg>
